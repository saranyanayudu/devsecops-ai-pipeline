name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  gate-1:
    name: 'Gate 1: Bandit SAST Scan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Force Gate 1 Fail
        run: exit 1

  gate-2-safety:
    name: "Gate 2: Safety Dependency Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Safety
        run: pip install safety
      - name: Run Safety Check
        run: safety check -r requirements.txt

  gate-3:
    name: 'Gate 3: Gitleaks Secret Detection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Force Gate 3 Fail
        run: exit 1

  gate-4-prompt-injection:
    name: "Gate 4: Custom Prompt Injection Scanner"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run Custom Scanner
        run: python inject_scanner.py
